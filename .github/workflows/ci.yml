name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check durable delivery journals without a phone
        run: |
          python3 tests/delivery_journal_test.py
          python3 tests/directory_sync_sql_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test web assets
        working-directory: pwa
        run: |
          npm install --global pnpm@11.0.0
          pnpm install --frozen-lockfile
          pnpm test
          node tests/push-preview.cjs
          node tests/dual-shell.cjs
          node tests/shell-cache.cjs
          pnpm build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Test and build without release credentials
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
