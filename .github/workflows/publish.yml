name: Publish verified CommLink APK
on:
  push:
    branches: [release/assets-v0.9.6]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify signed local build
        run: |
          sha256sum -c SHA256SUMS.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs CommLink-0.9.6.apk | grep -F 'Signer #1 certificate SHA-256 digest: 9e85f4c7e8330d222008aba01bac091f929ddd7b4db6d2621d1aa6834227de51'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging CommLink-0.9.6.apk | grep -F "versionCode='58' versionName='0.9.6'"
      - name: Publish source-tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.6 CommLink-0.9.6.apk SHA256SUMS.txt --repo 1Fann/sms-connect-assistant --target d151e24 --title 'CommLink 0.9.6' --notes-file release-notes.md
