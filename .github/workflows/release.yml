name: Signed Android Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify an already uploaded production-signed APK
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          manifest="docs/releases/${RELEASE_TAG#v}.manifest.json"
          if [[ -f "$manifest" ]] && gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "CommLink-${RELEASE_TAG#v}.apk"; then
            mkdir -p .work/existing-release
            gh release download "$RELEASE_TAG" --pattern "CommLink-${RELEASE_TAG#v}.apk" --pattern SHA256SUMS.txt --dir .work/existing-release
            python3 - "$manifest" <<'PY'
          import hashlib,json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          p=pathlib.Path('.work/existing-release')/m['name']
          assert p.stat().st_size == m['size']
          assert hashlib.sha256(p.read_bytes()).hexdigest() == m['sha256']
          sums=(p.parent/'SHA256SUMS.txt').read_text().splitlines()
          assert m['sha256']+'  '+m['name'] in sums
          PY
            echo 'provided=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.existing.outputs.provided != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.existing.outputs.provided != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        if: steps.existing.outputs.provided != 'true'
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0"

      - name: Restore signing key
        if: steps.existing.outputs.provided != 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          test -n "$ENCODED_KEYSTORE"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > app/keystore.jks

      - name: Build and verify signed APK
        if: steps.existing.outputs.provided != 'true'
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          version_name="${RELEASE_TAG#v}"
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ./gradlew :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F "versionName='${version_name}'"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/CommLink-${version_name}.apk"
          cd app/build/outputs/apk/release
          sha256sum "CommLink-${version_name}.apk" > SHA256SUMS.txt

      - name: Prepare release notes
        if: steps.existing.outputs.provided != 'true'
        run: cp "docs/releases/${RELEASE_TAG#v}.md" release-notes.md

      - name: Upload APK to the published release
        if: steps.existing.outputs.provided != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/CommLink-*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
